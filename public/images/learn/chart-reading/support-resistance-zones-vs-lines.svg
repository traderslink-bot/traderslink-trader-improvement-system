<!-- 2026-05-17 20:02 America/Toronto - TradersLink Learn SVG: support and resistance zones vs exact lines -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Support And Resistance Zones Versus Exact Lines</title>
  <desc id="desc">Educational chart comparing exact support and resistance lines with cleaner support and resistance zones.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0d1726"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter></defs>
  <rect width="1200" height="800" fill="url(#bg)"/><rect x="40" y="40" width="1120" height="720" rx="20" fill="#0f1b2d" stroke="#1e3149" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="86" fill="#f8fbff" font-family="Arial" font-size="34" font-weight="700">Draw Zones, Not Perfect Lines</text>
  <text x="70" y="116" fill="#9fb4c9" font-family="Arial" font-size="18">Real charts often react around areas. Zones usually explain the behavior better than one exact penny line.</text>
  <rect x="80" y="155" width="500" height="430" fill="#0b1422" stroke="#22354e" stroke-width="2"/>
  <rect x="620" y="155" width="500" height="430" fill="#0b1422" stroke="#22354e" stroke-width="2"/>
  <g font-family="Arial"><text x="96" y="145" fill="#fca5a5" font-size="21" font-weight="700">Too Exact</text><text x="636" y="145" fill="#a7f3d0" font-size="21" font-weight="700">Cleaner Zones</text></g>
  <g stroke="#203247" stroke-width="1" opacity="0.7"><line x1="80" y1="220" x2="580" y2="220"/><line x1="80" y1="285" x2="580" y2="285"/><line x1="80" y1="350" x2="580" y2="350"/><line x1="80" y1="415" x2="580" y2="415"/><line x1="80" y1="480" x2="580" y2="480"/><line x1="620" y1="220" x2="1120" y2="220"/><line x1="620" y1="285" x2="1120" y2="285"/><line x1="620" y1="350" x2="1120" y2="350"/><line x1="620" y1="415" x2="1120" y2="415"/><line x1="620" y1="480" x2="1120" y2="480"/></g>
  <line x1="92" y1="245" x2="568" y2="245" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/><line x1="92" y1="492" x2="568" y2="492" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="635" y="225" width="470" height="46" fill="#3b82f6" opacity="0.18"/><line x1="635" y1="248" x2="1105" y2="248" stroke="#60a5fa" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="635" y="468" width="470" height="46" fill="#10b981" opacity="0.18"/><line x1="635" y1="491" x2="1105" y2="491" stroke="#34d399" stroke-width="3" stroke-dasharray="10 8"/>
  <g>
    <line x1="125" y1="440" x2="125" y2="530" stroke="#22c55e" stroke-width="4"/><rect x="113" y="475" width="24" height="32" rx="3" fill="#22c55e"/><line x1="180" y1="385" x2="180" y2="505" stroke="#22c55e" stroke-width="4"/><rect x="168" y="425" width="24" height="55" rx="3" fill="#22c55e"/><line x1="235" y1="300" x2="235" y2="445" stroke="#22c55e" stroke-width="4"/><rect x="223" y="345" width="24" height="70" rx="3" fill="#22c55e"/><line x1="290" y1="230" x2="290" y2="365" stroke="#ef4444" stroke-width="4"/><rect x="278" y="270" width="24" height="65" rx="3" fill="#ef4444"/><line x1="345" y1="230" x2="345" y2="380" stroke="#22c55e" stroke-width="4"/><rect x="333" y="285" width="24" height="60" rx="3" fill="#22c55e"/><line x1="400" y1="265" x2="400" y2="420" stroke="#ef4444" stroke-width="4"/><rect x="388" y="310" width="24" height="75" rx="3" fill="#ef4444"/><line x1="455" y1="410" x2="455" y2="530" stroke="#22c55e" stroke-width="4"/><rect x="443" y="455" width="24" height="42" rx="3" fill="#22c55e"/><line x1="510" y1="385" x2="510" y2="525" stroke="#22c55e" stroke-width="4"/><rect x="498" y="430" width="24" height="60" rx="3" fill="#22c55e"/>
    <line x1="670" y1="440" x2="670" y2="530" stroke="#22c55e" stroke-width="4"/><rect x="658" y="475" width="24" height="32" rx="3" fill="#22c55e"/><line x1="730" y1="385" x2="730" y2="505" stroke="#22c55e" stroke-width="4"/><rect x="718" y="425" width="24" height="55" rx="3" fill="#22c55e"/><line x1="790" y1="300" x2="790" y2="445" stroke="#22c55e" stroke-width="4"/><rect x="778" y="345" width="24" height="70" rx="3" fill="#22c55e"/><line x1="850" y1="225" x2="850" y2="365" stroke="#ef4444" stroke-width="4"/><rect x="838" y="270" width="24" height="65" rx="3" fill="#ef4444"/><line x1="910" y1="230" x2="910" y2="380" stroke="#22c55e" stroke-width="4"/><rect x="898" y="285" width="24" height="60" rx="3" fill="#22c55e"/><line x1="970" y1="265" x2="970" y2="420" stroke="#ef4444" stroke-width="4"/><rect x="958" y="310" width="24" height="75" rx="3" fill="#ef4444"/><line x1="1030" y1="410" x2="1030" y2="530" stroke="#22c55e" stroke-width="4"/><rect x="1018" y="455" width="24" height="42" rx="3" fill="#22c55e"/>
  </g>
  <g font-family="Arial"><text x="115" y="625" fill="#fca5a5" font-size="18" font-weight="700">Problem: exact lines miss nearby reactions</text><text x="660" y="625" fill="#a7f3d0" font-size="18" font-weight="700">Better: zones capture real reaction areas</text><rect x="95" y="720" width="1010" height="26" rx="10" fill="#122238"/><text x="110" y="739" fill="#9fb4c9" font-size="16">Use zones to make the chart easier to read. The level should help decisions, not create false precision.</text></g>
</svg>