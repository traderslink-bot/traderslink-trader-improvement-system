  <text x="70" y="86" fill="#f8fbff" font-family="Arial" font-size="34" font-weight="700">Keep The Levels That Matter Now</text>
  <text x="70" y="116" fill="#9fb4c9" font-family="Arial" font-size="18">Far-away levels can be useful later, but the nearest actionable areas usually matter most for the current plan.</text>
