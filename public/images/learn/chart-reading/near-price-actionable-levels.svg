  <g font-family="Arial"><text x="230" y="258" fill="#d7ecff" font-size="18" font-weight="700">Closest resistance can affect the next decision</text><line x1="595" y1="260" x2="790" y2="315" stroke="#9fd1ff" stroke-width="2"/><circle cx="790" cy="315" r="5" fill="#9fd1ff"/><text x="250" y="526" fill="#c9f7e7" font-size="18" font-weight="700">Closest support defines nearby risk context</text><line x1="595" y1="520" x2="550" y2="486" stroke="#8cf0cc" stroke-width="2"/><circle cx="550" cy="486" r="5" fill="#8cf0cc"/><rect x="95" y="720" width="1010" height="26" rx="10" fill="#122238"/><text x="110" y="739" fill="#9fb4c9" font-size="16">Keep levels that can affect the current plan. Save far-away levels for later review.</text></g>
