  </g>
  <g font-family="Arial"><text x="130" y="638" fill="#fca5a5" font-size="18" font-weight="700">Problem: every small wiggle becomes a line</text><text x="675" y="638" fill="#a7f3d0" font-size="18" font-weight="700">Better: focus on zones that help decisions</text><rect x="95" y="720" width="1010" height="26" rx="10" fill="#122238"/><text x="110" y="739" fill="#9fb4c9" font-size="16">Useful support and resistance should reduce confusion, not add more noise.</text></g>
</svg>
