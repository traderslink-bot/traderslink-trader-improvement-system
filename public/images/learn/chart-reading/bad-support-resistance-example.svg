<!-- 2026-05-17 19:46 America/Toronto - TradersLink Learn SVG: bad support and resistance drawing example -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Bad Support And Resistance Drawing Example</title>
  <desc id="desc">Educational chart showing a cluttered support and resistance example with too many random lines compared with cleaner zones.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0d1726"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter></defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="720" rx="20" fill="#0f1b2d" stroke="#1e3149" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="86" fill="#f8fbff" font-family="Arial" font-size="34" font-weight="700">Common Level-Drawing Mistake</text>
  <text x="70" y="116" fill="#9fb4c9" font-family="Arial" font-size="18">Too many exact lines can make the chart harder to use. Useful levels should clarify decisions.</text>
  <rect x="80" y="150" width="500" height="450" fill="#0b1422" stroke="#22354e" stroke-width="2"/>
  <rect x="620" y="150" width="500" height="450" fill="#0b1422" stroke="#22354e" stroke-width="2"/>
  <g font-family="Arial"><text x="95" y="138" fill="#fca5a5" font-size="21" font-weight="700">Cluttered / Less Useful</text><text x="635" y="138" fill="#a7f3d0" font-size="21" font-weight="700">Cleaner Zones</text></g>
  <g stroke="#203247" stroke-width="1" opacity="0.7">
    <line x1="80" y1="210" x2="580" y2="210"/><line x1="80" y1="270" x2="580" y2="270"/><line x1="80" y1="330" x2="580" y2="330"/><line x1="80" y1="390" x2="580" y2="390"/><line x1="80" y1="450" x2="580" y2="450"/><line x1="80" y1="510" x2="580" y2="510"/>
    <line x1="620" y1="210" x2="1120" y2="210"/><line x1="620" y1="270" x2="1120" y2="270"/><line x1="620" y1="330" x2="1120" y2="330"/><line x1="620" y1="390" x2="1120" y2="390"/><line x1="620" y1="450" x2="1120" y2="450"/><line x1="620" y1="510" x2="1120" y2="510"/>
  </g>
  <g stroke="#ef4444" stroke-width="2" opacity="0.75" stroke-dasharray="6 5">
    <line x1="90" y1="206" x2="570" y2="206"/><line x1="90" y1="238" x2="570" y2="238"/><line x1="90" y1="267" x2="570" y2="267"/><line x1="90" y1="304" x2="570" y2="304"/><line x1="90" y1="334" x2="570" y2="334"/><line x1="90" y1="371" x2="570" y2="371"/><line x1="90" y1="408" x2="570" y2="408"/><line x1="90" y1="445" x2="570" y2="445"/><line x1="90" y1="488" x2="570" y2="488"/><line x1="90" y1="528" x2="570" y2="528"/>
  </g>
  <rect x="635" y="205" width="470" height="44" fill="#3b82f6" opacity="0.18"/><line x1="635" y1="227" x2="1105" y2="227" stroke="#60a5fa" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="635" y="480" width="470" height="44" fill="#10b981" opacity="0.18"/><line x1="635" y1="502" x2="1105" y2="502" stroke="#34d399" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="952" y="198" fill="#9fd1ff" font-family="Arial" font-size="18" font-weight="700">Resistance Zone</text>
  <text x="972" y="552" fill="#b5f5de" font-family="Arial" font-size="18" font-weight="700">Support Zone</text>
  <g>
