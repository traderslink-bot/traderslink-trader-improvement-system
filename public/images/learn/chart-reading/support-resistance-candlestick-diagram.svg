<!-- 2026-05-17 19:40 America/Toronto - TradersLink Learn SVG: support and resistance candlestick diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Support And Resistance Candlestick Diagram</title>
