name: Trader Intelligence v3 GA1-B Governed Scale Proof

on:
  workflow_dispatch:

jobs:
  governed-scale-proof:
    name: GA1-B 10,000-row governed scale proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TI_V3_GA1_B_SCALE_STAGE_LOG: artifacts/ga1-b-scale-stage-records.ndjson

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare non-sensitive scale records directory
        run: mkdir -p artifacts

      - name: Run GA1-B governed 10,000-row scale proof
        run: npm run verify:ti-v3:ga1-b -- --scale-only

      - name: Upload GA1-B scale stage records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga1-b-governed-scale-stage-records
          path: artifacts/ga1-b-scale-stage-records.ndjson
          if-no-files-found: warn
          retention-days: 14
