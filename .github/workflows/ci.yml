name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify Trader Intelligence v3 GA0-A2 exact truth
        run: npm run verify:ti-v3:ga0-a2

      - name: Verify Trader Intelligence v3 architecture boundaries
        run: npm run verify:ti-v3:architecture

      - name: Verify Trader Intelligence v3 private-data safety
        run: npm run verify:ti-v3:private-data

      - name: Verify Trader Intelligence v3 GA0-B deterministic proof
        run: npm run verify:ti-v3:ga0-b

      - name: Verify Trader Intelligence v3 GA1-A generic query gateway
        run: npm run verify:ti-v3:ga1-a

      - name: Verify Layer 2
        run: npm run verify:layer2

      - name: Verify Layer 3
        run: npm run verify:layer3
