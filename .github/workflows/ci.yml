name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify Trader Intelligence v3 architecture boundaries
        run: npm run verify:ti-v3:architecture

      - name: Verify Trader Intelligence v3 private-data safety
        run: npm run verify:ti-v3:private-data

      - name: Verify Layer 2
        run: npm run verify:layer2

      - name: Verify Layer 3
        run: npm run verify:layer3
